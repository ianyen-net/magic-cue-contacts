  <style id="gate-styles">
    :root {
      --cl-bg: #0a0a0a;
      --cl-card: #0d0d0d;
      --cl-surface: #121212;
      --cl-elevated: #292929;
      --cl-border: rgba(255, 255, 255, 0.10);
      --cl-border-strong: rgba(255, 255, 255, 0.18);
      --cl-text: #f5f5f8;
      --cl-muted: #ababab;
      --font-sans: 'Satoshi', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background-color: var(--cl-bg);
      color: var(--cl-text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .case-password-gate {
      position: fixed;
      inset: 0;
      z-index: 950;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(650px circle at 50% 0%, rgba(255, 255, 255, 0.05), transparent 65%),
        var(--cl-bg);
    }
    .case-password-card {
      position: relative;
      width: 100%;
      max-width: 400px;
      background: var(--cl-surface);
      border: 1px solid var(--cl-border);
      border-radius: 36px;
      padding: 40px 34px 34px;
      box-shadow:
        0 32px 80px rgba(0, 0, 0, 0.72),
        inset 0 1px 0 rgba(255, 255, 255, 0.10);
      text-align: center;
      animation: caseGateEnter 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes caseGateEnter {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .case-password-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 18px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
      color: var(--cl-text);
      border: 1px solid var(--cl-border);
    }
    .case-password-title {
      font-family: var(--font-sans);
      font-size: 26px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--cl-text);
      margin-bottom: 10px;
    }
    .case-password-desc {
      font-family: var(--font-sans);
      font-size: 14.5px;
      line-height: 1.5;
      color: var(--cl-muted);
      margin-bottom: 24px;
    }
    .case-password-desc strong {
      color: var(--cl-text);
      font-weight: 600;
    }
    .case-password-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .case-password-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .case-password-input {
      width: 100%;
      height: 48px;
      padding: 0 46px 0 18px;
      border-radius: 999px;
      border: 1px solid var(--cl-border);
      background: var(--cl-bg);
      color: var(--cl-text);
      font-family: var(--font-sans);
      font-size: 14.5px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .case-password-input::placeholder {
      color: #6e6e6e;
    }
    .case-password-input:focus {
      border-color: rgba(255, 255, 255, 0.32);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.06);
    }
    .case-password-input.is-error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
    }
    .case-password-toggle {
      position: absolute;
      right: 10px;
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--cl-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      transition: color 0.2s ease, background 0.2s ease;
    }
    .case-password-toggle:hover {
      color: var(--cl-text);
      background: rgba(255, 255, 255, 0.08);
    }
    .case-password-submit {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 999px;
      background: var(--cl-text);
      color: var(--cl-bg);
      font-family: var(--font-sans);
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }
    .case-password-submit:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .case-password-submit:active {
      transform: translateY(0);
    }
    .case-password-submit:disabled {
      opacity: 0.55;
      cursor: default;
      transform: none;
    }
    .case-password-help {
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.45;
      color: var(--cl-muted);
      margin: -2px 0 4px;
    }
    .case-password-help a {
      color: var(--cl-text);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 500;
      transition: opacity 0.2s ease;
    }
    .case-password-help a:hover {
      opacity: 0.8;
    }
    .case-password-error {
      font-family: var(--font-sans);
      font-size: 13px;
      color: #ef4444;
      min-height: 18px;
      margin-top: 2px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .case-password-error.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    @keyframes caseGateShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .case-password-card.is-shaking {
      animation: caseGateShake 0.38s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }
  </style>
</head>

  <div class="case-password-gate" id="gate-wrap">

      <h2 class="case-password-title" id="case-gate-title">Magic Cue</h2>

      <form class="case-password-form" id="gate-form" autocomplete="off">

              <circle cx="12" cy="12" r="3"></circle>

        <p class="case-password-help">Don’t have the password? <a href="mailto:ianyenyh@gmail.com?subject=Portfolio%20Access%20Request&amp;body=Hi%20Ian%2C%0A%0AI%27d%20love%20to%20request%20the%20password%20to%20view%20your%20portfolio%20case%20studies%20and%20prototypes.%0A%0AThanks!">Email Ian</a> to ask for it</p>
        <button type="submit" class="case-password-submit" id="gate-btn">

          <span aria-hidden="true">→</span>
        </button>
        <div class="case-password-error" id="gate-err" role="alert">Incorrect password. Please try again.</div>
      </form>
    </div>
  </div>

    const SESSION_KEY = 'mc_proto_pass_v1';
    const IS_MODULE = false;

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const len = bin.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    async function decryptPayload(password) {
      const enc = new TextEncoder();
      const salt = b64ToBytes(PAYLOAD.salt);
      const iv = b64ToBytes(PAYLOAD.iv);
      const mac = b64ToBytes(PAYLOAD.mac);
      const ct = b64ToBytes(PAYLOAD.ct);
      const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveBits']
      );
      const bits = await crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt: salt, iterations: PAYLOAD.iter, hash: 'SHA-256' },
        keyMaterial,
        512
      );
      const keyBytes = new Uint8Array(bits);
      const encKeyBytes = keyBytes.slice(0, 32);
      const macKeyBytes = keyBytes.slice(32, 64);

      const hmacKey = await crypto.subtle.importKey(
        'raw', macKeyBytes, { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']
      );
      const msgToVerify = new Uint8Array(iv.length + ct.length);
      msgToVerify.set(iv, 0);
      msgToVerify.set(ct, iv.length);
      const valid = await crypto.subtle.verify('HMAC', hmacKey, mac, msgToVerify);
      if (!valid) throw new Error('Invalid password');

      const aesKey = await crypto.subtle.importKey(
        'raw', encKeyBytes, { name: 'AES-CBC' }, false, ['decrypt']
      );
      const decryptedBuf = await crypto.subtle.decrypt(
        { name: 'AES-CBC', iv: iv },
        aesKey,
        ct
      );
      const decText = new TextDecoder().decode(decryptedBuf);
      return JSON.parse(decText);
    }

    function mountPrototype(data) {
      document.title = data.title || document.title;
      (data.styles || []).forEach((cssText) => {
        const st = document.createElement('style');
        st.textContent = cssText;
        document.head.appendChild(st);
      });
      const gs = document.getElementById('gate-styles');
      if (gs) gs.remove();
      if (data.bodyAttrs) {
        Object.keys(data.bodyAttrs).forEach((k) => {
          document.body.setAttribute(k, data.bodyAttrs[k]);
        });
      }
      document.body.innerHTML = data.body;
      (data.scripts || []).forEach((jsText) => {
        const sc = document.createElement('script');
        if (IS_MODULE) sc.type = 'module';
        sc.textContent = jsText;
        document.body.appendChild(sc);
      });
      setTimeout(() => {
        window.dispatchEvent(new Event('resize'));
      }, 60);
    }

    async function tryUnlock(password, isAuto) {
      const btn = document.getElementById('gate-btn');
      const btnLabel = document.getElementById('gate-btn-label');
      const input = document.getElementById('gate-input');
      const err = document.getElementById('gate-err');
      const card = document.getElementById('gate-card');
      if (btn) btn.disabled = true;
      if (btnLabel) btnLabel.textContent = 'Unlocking...';
      if (err) err.classList.remove('is-visible');
      if (input) input.classList.remove('is-error');
      try {
        const data = await decryptPayload(password);
        try { sessionStorage.setItem(SESSION_KEY, password); } catch (e) {}
        mountPrototype(data);
      } catch (e) {
        if (isAuto) {
          try { sessionStorage.removeItem(SESSION_KEY); } catch (ex) {}
          if (btn) btn.disabled = false;
          if (btnLabel) btnLabel.textContent = 'Continue';
          return;
        }
        if (btn) btn.disabled = false;
        if (btnLabel) btnLabel.textContent = 'Continue';
        if (input) { input.classList.add('is-error'); input.select(); }
        if (err) err.classList.add('is-visible');
        if (card) {
          card.classList.remove('is-shaking');
          void card.offsetWidth;
          card.classList.add('is-shaking');
        }
      }
    }

    const toggleBtn = document.getElementById('gate-toggle');
    const inputEl = document.getElementById('gate-input');
    const errEl = document.getElementById('gate-err');
    if (toggleBtn && inputEl) {
      toggleBtn.addEventListener('click', function() {
        const isPwd = inputEl.type === 'password';
        inputEl.type = isPwd ? 'text' : 'password';
        toggleBtn.setAttribute('aria-label', isPwd ? 'Hide password' : 'Show password');
        inputEl.focus();
      });
    }
    if (inputEl && errEl) {
      inputEl.addEventListener('input', function() {
        inputEl.classList.remove('is-error');
        errEl.classList.remove('is-visible');
      });
    }

    let saved = null;
    try { saved = sessionStorage.getItem(SESSION_KEY); } catch (e) {}
    if (saved) {
      const wrap = document.getElementById('gate-wrap');
      if (wrap) wrap.style.opacity = '0';
      tryUnlock(saved, true).then(() => {
        const w = document.getElementById('gate-wrap');
        if (w) w.style.opacity = '1';
      });
    }

    const form = document.getElementById('gate-form');
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const val = document.getElementById('gate-input').value.trim();
        tryUnlock(val, false);
      });
    }
  })();
  </script>
