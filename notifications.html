  <style id="gate-styles">
    :root {
      --bg-page: #030712;
      --bg-surface: #071022;
      --bg-elevated: #0D1B36;
      --bg-card: #071022;
      --text-primary: #F7F3F6;
      --text-secondary: #B2C3D6;
      --text-muted: #86A8CF;
      --border-subtle: rgba(134, 168, 207, 0.16);
      --border-strong: rgba(134, 168, 207, 0.30);
      --accent: #86A8CF;
      --accent-saffron: #C38EB4;
      --accent-soft: rgba(134, 168, 207, 0.16);
      --font-display: 'Tanker', 'Big Shoulders Display', sans-serif;
      --font-sans: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .case-password-gate {
      position: fixed;
      inset: 0;
      z-index: 950;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(650px circle at 20% 18%, rgba(195, 142, 180, 0.10), transparent 60%),
        radial-gradient(700px circle at 82% 82%, rgba(134, 168, 207, 0.12), transparent 60%),
        rgba(3, 7, 18, 0.94);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
    }
    .case-password-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: 28px;
      padding: 38px 34px 32px;
      box-shadow:
        0 28px 70px rgba(0, 0, 0, 0.55),
        0 4px 16px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      text-align: center;
      animation: caseGateEnter 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes caseGateEnter {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .case-password-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 20px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(134, 168, 207, 0.30);
    }
    .case-password-kicker {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-saffron);
      margin-bottom: 8px;
    }
    .case-password-title {
      font-family: var(--font-display);
      font-size: 36px;
      font-weight: 400;
      line-height: 1.02;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text-primary);
      margin-bottom: 10px;
    }
    .case-password-desc {
      font-family: var(--font-sans);
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }
    .case-password-desc strong {
      color: var(--text-primary);
      font-weight: 600;
    }
    .case-password-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .case-password-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .case-password-input {
      width: 100%;
      height: 50px;
      padding: 0 46px 0 18px;
      border-radius: 14px;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      letter-spacing: 0.04em;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .case-password-input::placeholder {
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }
    .case-password-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .case-password-input.is-error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
    }
    .case-password-toggle {
      position: absolute;
      right: 12px;
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.2s ease, background 0.2s ease;
    }
    .case-password-toggle:hover {
      color: var(--text-primary);
      background: rgba(134, 168, 207, 0.14);
    }
    .case-password-submit {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 14px;
      background: var(--text-primary);
      color: var(--bg-page);
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.18s ease, opacity 0.18s ease, background 0.2s ease;
    }
    .case-password-submit:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .case-password-submit:active {
      transform: translateY(0);
    }
    .case-password-submit:disabled {
      opacity: 0.6;
      cursor: default;
      transform: none;
    }
    .case-password-error {
      font-family: var(--font-sans);
      font-size: 13px;
      color: #ef4444;
      min-height: 18px;
      margin-top: 2px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .case-password-error.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    .case-password-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .case-password-back:hover {
      color: var(--text-primary);
    }
    @keyframes caseGateShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .case-password-card.is-shaking {
      animation: caseGateShake 0.38s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }
  </style>
</head>

  <div class="case-password-gate" id="gate-wrap">
    <div class="case-password-card" id="gate-card" role="dialog" aria-modal="true" aria-labelledby="case-gate-title">
      <div class="case-password-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <div class="case-password-kicker">Protected Prototype · Magic Cue</div>
      <h2 class="case-password-title" id="case-gate-title">Enter Password</h2>

      <form class="case-password-form" id="gate-form" autocomplete="off">
        <div class="case-password-input-wrap">
          <input
            type="password"
            id="gate-input"
            class="case-password-input"
            placeholder="Enter portfolio password"
            aria-label="Prototype password"
            required
            autofocus

          <button type="button" class="case-password-toggle" id="gate-toggle" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <button type="submit" class="case-password-submit" id="gate-btn">
          <span id="gate-btn-label">Unlock Prototype</span>
          <span aria-hidden="true">→</span>
        </button>
        <div class="case-password-error" id="gate-err" role="alert">Incorrect password. Please use the same password as the portfolio site.</div>
      </form>
      <a href="https://ianyen.net/ai-in-contacts.html" class="case-password-back">← Back to Portfolio</a>
    </div>
  </div>

    const SESSION_KEY = 'mc_proto_pass_v1';
    const IS_MODULE = false;

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const len = bin.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    async function decryptPayload(password) {
      const enc = new TextEncoder();
      const salt = b64ToBytes(PAYLOAD.salt);
      const iv = b64ToBytes(PAYLOAD.iv);
      const mac = b64ToBytes(PAYLOAD.mac);
      const ct = b64ToBytes(PAYLOAD.ct);
      const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveBits']
      );
      const bits = await crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt: salt, iterations: PAYLOAD.iter, hash: 'SHA-256' },
        keyMaterial,
        512
      );
      const keyBytes = new Uint8Array(bits);
      const encKeyBytes = keyBytes.slice(0, 32);
      const macKeyBytes = keyBytes.slice(32, 64);

      const hmacKey = await crypto.subtle.importKey(
        'raw', macKeyBytes, { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']
      );
      const msgToVerify = new Uint8Array(iv.length + ct.length);
      msgToVerify.set(iv, 0);
      msgToVerify.set(ct, iv.length);
      const valid = await crypto.subtle.verify('HMAC', hmacKey, mac, msgToVerify);
      if (!valid) throw new Error('Invalid password');

      const aesKey = await crypto.subtle.importKey(
        'raw', encKeyBytes, { name: 'AES-CBC' }, false, ['decrypt']
      );
      const decryptedBuf = await crypto.subtle.decrypt(
        { name: 'AES-CBC', iv: iv },
        aesKey,
        ct
      );
      const decText = new TextDecoder().decode(decryptedBuf);
      return JSON.parse(decText);
    }

    function mountPrototype(data) {
      document.title = data.title || document.title;
      (data.styles || []).forEach((cssText) => {
        const st = document.createElement('style');
        st.textContent = cssText;
        document.head.appendChild(st);
      });
      const gs = document.getElementById('gate-styles');
      if (gs) gs.remove();
      document.body.innerHTML = data.body;
      (data.scripts || []).forEach((jsText) => {
        const sc = document.createElement('script');
        if (IS_MODULE) sc.type = 'module';
        sc.textContent = jsText;
        document.body.appendChild(sc);
      });
    }

    async function tryUnlock(password, isAuto) {
      const btn = document.getElementById('gate-btn');
      const btnLabel = document.getElementById('gate-btn-label');
      const input = document.getElementById('gate-input');
      const err = document.getElementById('gate-err');
      const card = document.getElementById('gate-card');
      if (btn) btn.disabled = true;
      if (btnLabel) btnLabel.textContent = 'Unlocking...';
      if (err) err.classList.remove('is-visible');
      if (input) input.classList.remove('is-error');
      try {
        const data = await decryptPayload(password);
        try { sessionStorage.setItem(SESSION_KEY, password); } catch (e) {}
        mountPrototype(data);
      } catch (e) {
        if (isAuto) {
          try { sessionStorage.removeItem(SESSION_KEY); } catch (ex) {}
          if (btn) btn.disabled = false;
          if (btnLabel) btnLabel.textContent = 'Unlock Prototype';
          return;
        }
        if (btn) btn.disabled = false;
        if (btnLabel) btnLabel.textContent = 'Unlock Prototype';
        if (input) { input.classList.add('is-error'); input.select(); }
        if (err) err.classList.add('is-visible');
        if (card) {
          card.classList.remove('is-shaking');
          void card.offsetWidth;
          card.classList.add('is-shaking');
        }
      }
    }

    const toggleBtn = document.getElementById('gate-toggle');
    const inputEl = document.getElementById('gate-input');
    const errEl = document.getElementById('gate-err');
    if (toggleBtn && inputEl) {
      toggleBtn.addEventListener('click', function() {
        const isPwd = inputEl.type === 'password';
        inputEl.type = isPwd ? 'text' : 'password';
        toggleBtn.setAttribute('aria-label', isPwd ? 'Hide password' : 'Show password');
        inputEl.focus();
      });
    }
    if (inputEl && errEl) {
      inputEl.addEventListener('input', function() {
        inputEl.classList.remove('is-error');
        errEl.classList.remove('is-visible');
      });
    }

    let saved = null;
    try { saved = sessionStorage.getItem(SESSION_KEY); } catch (e) {}
    if (saved) {
      const wrap = document.getElementById('gate-wrap');
      if (wrap) wrap.style.opacity = '0';
      tryUnlock(saved, true).then(() => {
        const w = document.getElementById('gate-wrap');
        if (w) w.style.opacity = '1';
      });
    }

    const form = document.getElementById('gate-form');
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const val = document.getElementById('gate-input').value.trim();
        tryUnlock(val, false);
      });
    }
  })();
  </script>
</body>
</html>
